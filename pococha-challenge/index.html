const keys=Array.from({length:10},(_,i)=>'2026-'+String(i+1).padStart(2,'0'));
const $=id=>document.getElementById(id);let current='2026-10';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function line(m,i){const n=String(i+1).padStart(2,'0');return `［${n}］${m.need} ${m.label}`;}
function copyText(kind){const d=DATA[current];if(!d||!d.verified?.[kind]||!Array.isArray(d[kind]))return null;const name=d.labels?.[kind]||(kind==='open'?'🟠オープン部門':'🩷ファミリー部門'),rows=d[kind].map(line).join('\n');return `【${d.title} ぽこチャレ】\n${name}\n\n開始：${d.start}\n終了：${d.end}\n\n${rows}`;}
function lockedCard(kind,d){const isOpen=kind==='open',title=d?.labels?.[kind]||(isOpen?'🟠オープン':'🩷ファミリー'),status=d?.confidence?.[kind]==='対象なし'?'対象なし':'未収録';return `<article class="department ${kind} locked"><div class="department-head"><h2>${title}</h2></div><div class="locked-note">${status}</div></article>`;}
function card(kind,d){if(!d.verified?.[kind]||!Array.isArray(d[kind]))return lockedCard(kind,d,d.lockReason?.[kind]);const isOpen=kind==='open',title=d?.labels?.[kind]||(isOpen?'🟠オープン':'🩷ファミリー'),lis=d[kind].map((m,i)=>{const num=`［${String(i+1).padStart(2,'0')}］`,need=m.f?`<span class="f">Ｆ</span>${esc(m.need.replace(/^Ｆ/,''))}`:esc(m.need);return `<li class="mission"><span class="num">${num}</span><span class="need">${need}</span><span class="answer">${esc(m.label)}</span></li>`;}).join('');return `<article class="department ${kind}"><div class="department-head"><h2>${title}</h2><div class="period"><span>開始 <b>${esc(d.start)}</b></span><span>終了 <b>${esc(d.end)}</b></span></div></div><button class="copy-btn" type="button" data-copy="${kind}">${isOpen?'オープン':'ファミリー'}をコピー</button><ol class="missions">${lis}</ol></article>`;}
function researchView(){return lockedCard('open')+lockedCard('family');}
function setMonth(key,push=true){if(!keys.includes(key))key='2026-10';current=key;$('month').value=key;document.querySelector('.manual-copy')?.remove();[...$('quick').children].forEach(b=>b.setAttribute('aria-current',b.dataset.month===key?'true':'false'));const d=DATA[key];$('departments').innerHTML=d?card('open',d)+card('family',d):researchView();$('prev').disabled=keys.indexOf(key)<=0;$('next').disabled=keys.indexOf(key)>=keys.length-1;if(push){const u=new URL(location.href);u.searchParams.set('month',key);history.replaceState(null,'',u);}}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1900);}
async function copy(kind){const text=copyText(kind),requestMonth=current;if(!text){toast('未収録');return;}try{if(!navigator.clipboard)throw new Error('fallback');await navigator.clipboard.writeText(text);if(requestMonth===current)toast('コピーしました');}catch(e){if(requestMonth!==current)return;let box=document.querySelector('.manual-copy');if(!box){box=document.createElement('textarea');box.className='manual-copy';box.readOnly=true;box.setAttribute('aria-label','コピー用テキスト');document.querySelector('main').appendChild(box);}box.value=text;box.focus();box.select();toast('選択しました');}}
$('departments').addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b)copy(b.dataset.copy);});$('sharePage').addEventListener('click',async()=>{const url=location.href;try{if(navigator.share){await navigator.share({title:'ポコチャレ解答集',text:'ポコチャレ解答集',url});}else if(navigator.clipboard){await navigator.clipboard.writeText(url);toast('URLをコピーしました');}else{throw new Error('fallback');}}catch(e){if(e?.name==='AbortError')return;try{await navigator.clipboard.writeText(url);toast('URLをコピーしました');}catch(_){toast('共有できませんでした');}}});$('refreshPage').addEventListener('click',()=>{toast('更新中');setTimeout(()=>location.reload(),80);});$('month').addEventListener('change',e=>setMonth(e.target.value));$('prev').addEventListener('click',()=>{const i=keys.indexOf(current);if(i>0)setMonth(keys[i-1]);});$('next').addEventListener('click',()=>{const i=keys.indexOf(current);if(i<keys.length-1)setMonth(keys[i+1]);});$('month').min=keys[0];$('month').max=keys[keys.length-1];$('quick').innerHTML=keys.map(k=>{const d=DATA[k],r=RESEARCH[k],label=d?.title||r?.title||k;return `<button type="button" class="quick" data-month="${k}">${label.replace('2026年','')}</button>`;}).join('');$('quick').addEventListener('click',e=>{const b=e.target.closest('[data-month]');if(b)setMonth(b.dataset.month);});const requested=new URL(location.href).searchParams.get('month');const now=new Date();const currentMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;const fallback=keys.filter(k=>k<=currentMonth).pop()||keys[keys.length-1];const initial=keys.includes(requested)?requested:(keys.includes(currentMonth)?currentMonth:fallback);setMonth(initial,false);
</script>
