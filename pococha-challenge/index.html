<style>

*{box-sizing:border-box}html{font-size:16px;-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;padding:max(12px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}main{width:min(100%,980px);margin:auto}header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 2px 10px}h1{font-size:clamp(1.15rem,4vw,1.65rem);line-height:1.2;margin:0;font-weight:900;letter-spacing:.01em}.header-note{margin:4px 0 0;color:var(--muted);font-size:.74rem;line-height:1.45}.badge{flex:none;padding:5px 9px;border-radius:999px;background:#111827;color:#fff;font-size:.68rem;font-weight:800;white-space:nowrap}.header-actions{display:flex;align-items:center;gap:5px;flex:none}.refresh-mini{width:26px;height:26px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--muted);font-size:.82rem;font-weight:900;line-height:1;box-shadow:none}.refresh-mini:active{transform:scale(.94);background:var(--bg)}.controls{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px;box-shadow:var(--shadow);margin-bottom:9px}.month-row{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:7px;align-items:center}.nav,.month-input,.quick{min-height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-weight:800}.nav{font-size:1.25rem;padding:0}.month-input{width:100%;padding:0 8px;text-align:center}.quick-row{display:flex;gap:6px;margin-top:7px;overflow-x:auto;padding-bottom:1px;scrollbar-width:none}.quick-row::-webkit-scrollbar{display:none}.quick{min-height:34px;padding:0 11px;white-space:nowrap;font-size:.78rem}.quick[ adding:.12em .34em;border-radius:999px;background:#e8f0ff;color:#123b7a;font-weight:950;line-height:1.15;white-space:nowrap}.mission .answer{min-width:0;font-weight:850;color:var(--ink);line-height:1.2;overflow-wrap:anywhere}.open .mission .need{background:#fff0e6;color:#a8430a}.family .mission .need{background:#ffeaf4;color:#9b245f}.empty{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}.info{margin-top:9px;display:grid;gap:7px}details{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:900;font-size:.88rem;display:flex;align-items:center;justify-content:space-between;gap:8px;-webkit-tap-highlight-color:transparent}summary::-webkit-details-marker{display:none}summary::after{content:"＋";font-size:1.05rem;color:var(--muted)}details[open] summary::after{content:"−"}.detail-body{border-top:1px solid var(--line);padding:11px 13px;font-size:.78rem;line-height:1.7;color:var(--muted)}.detail-body p{margin:0 0 8px}.detail-body p:last-child{margin-bottom:0}.checks{display:grid;gap:5px;margin:0 0 10px;padding:0;list-style:none}.checks li{background:var(--bg);border-radius:9px;padding:7px 8px;color:var(--ink)}.source-list{display:grid;gap:7px}.source{border-left:3px solid var(--blue);padding:5px 7px;background:var(--bg);border-radius:0 8px 8px 0}.source a{color:var(--blue);font-weight:850;text-decoration:none;overflow-wrap:anywhere}.source small{display:block;margin-top:2px;line-height:1.5}.caution{color:var(--danger);font-weight:750}.manual-copy{width:100%;min-height:150px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:9px;font-size:.75rem;line-height:1.5;resize:vertical}footer{padding:15px 6px 0;text-align:center;color:var(--muted);font-size:.68rem;line-height:1.6}.toast{position:fixed;z-index:10;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#111827;color:#fff;border-radius:999px;padding:9px 14px;font-size:.78rem;font-weight:850;transition:.2s;max-width:calc(100vw - 24px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}.toast.show{opacity:1;transform:translate(-50%,0)}

@media(prefers-color-scheme:dark){.mission .num{color:#7fa6ff}.open .mission .need{background:#402719;color:#ffb27e}.family .mission .need{background:#402132;color:#ff9dcb}.mission .answer{color:var(--ink)}}
@media(max-width:390px){.mission{font-size:clamp(.67rem,3.05vw,.76rem);line-height:1.18;letter-spacing:-.05em;padding-left:2px;padding-right:2px}.mission .num{margin-right:0}.mission .need{padding:.1em .28em;margin-right:.22em}.mission .answer{line-height:1.16}}
@media(max-width:360px){body{padding-left:5px;padding-right:5px}.departments{gap:5px}.department{border-radius:13px}.department-head{padding-left:4px;padding-right:4px}.missions{padding-left:3px;padding-right:3px}.mission{padding-left:3px;padding-right:3px;min-height:29px}.copy-btn{width:calc(100% - 8px);margin:4px}}
@media(min-width:700px){body{padding-left:18px;padding-right:18px}.departments{gap:14px}.department-head{padding:14px}.missions{padding:0 10px 12px;gap:5px}.mission{font-size:.88rem;min-height:35px;padding:6px 8px}.copy-btn{min-height:44px}.period{font-size:.82rem}}

<body>
<main>
<header><div><h1>ぽこチャレ解答一覧</h1><p class="header-note">オープン・ファミリーをスマホでも2列表示</p></div><div class="header-actions"><button class="refresh-mini" id="refreshPage" type="button" aria-label="最新表示に更新" title="更新">↻</button><span class="badge">非公式</span></div></header>
<section class="controls" aria-label="年月選択"><div class="month-row"><button class="nav" id="prev" type="button" aria-label="前月">‹</button><input class="month-input" id="month" type="month" min="2026-09" max="2026-10" value="2026-10" aria-label="表示する年月"><button class="nav" id="next" type="button" aria-label="翌月">›</button></div><div class="quick-row" id="quick"></div><p class="status" id="status" role="status"></p></section>
<section class="departments" id="departments" aria-live="polite"></section>
<section class="info"><details id="answerEvidence"><summary>解答の根拠と入力の注意</summary><div class="detail-body" id="evidenceBody"></div></details><details id="sourcePanel"><summary>情報元と照合結果</summary><div class="detail-body" id="sourceBody"></div></details></section>
<footer>© 2026 Yoshi1012／Pococha非公式ツール<br>最終データ確認：2026/10/07　表示内容よりPocochaアプリ内表示を優先してください。</footer>
</main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const FAQ='https://pococha-jp.pococha.com/hc/ja/articles/31868519743385-%E3%81%BD%E3%81%93%E3%83%81%E3%83%A3%E3%83%AC';
function missions(words,family=false){const out=[];out.push({need:family?'Ｆ5人':'15人',label:words[0],f:family});out.push({need:'10人',label:'コメント'});out.push({need:'10個',label:'BOX開封'});out.push({need:'1万',label:'いいね長押し'});out.push({need:family?'Ｆ5人':'15人',label:words[1],f:family});out.push({need:'2人',label:'初見コメント'});out.push({need:'2万',label:'いいね長押し'});out.push({need:'15人',label:'コメント'});out.push({need:'15個',label:'BOX開封'});out.push({need:'20人',label:'いいねワンぽち'});out.push({need:'3人',label:'初見コメント'});out.push({need:family?'Ｆ5人':'15人',label:words[2],f:family});out.push({need:'3万',label:'いいね長押し'});return out;}
const DATA={'2026-09':{title:'2026年9月',start:'9/7(月)15:00',end:'9/13(日)23:59',open:missions(['防災の日','カンパン','さつまいも']),family:missions(['金木犀','敬老の日','シルバーウィーク'],true),evidence:['ファミリー限定表示：［01］［05］［12］の必要数左側に「Ｆ」を付与。','［10］は総いいね数ではなく、20人が各1回以上いいねする「いいねワンぽち」として区別。','9月のＦ条件は別資料で補完しているため、解答・人数・Ｆ条件の根拠が同一記事でない項目があります。'],sources:[['解答・必要数','GTオレンジ「9月ポコチャレ回答」','https://note.com/gt_orange/n/n6decf5e63197','オープン・ファミリーの解答と必要数を照合。'],['Ｆ条件','さいとう園長「9月ぽこチャレ」','https://note.com/sauron_drum/n/n0fdf20bc4710','ファミリー限定の対象を補完。'],['同文補助','夜遊び紳士「9月ぽこチャレ」','https://note.com/gt_pink/n/ne56ae74b68d5','既存記事とほぼ同文のため、独立した照合数には重複加算しない。'],['開催日時','HAISHIN Lab・オープン部門','https://haishin-lab.com/pocochaevent/1001223080/','開始・終了日時を確認。'],['開催日時','HAISHIN Lab・ファミリー部門','https://haishin-lab.com/pocochaevent/1001223090/','開始・終了日時を確認。'],['公式確認先','Pococha公式FAQ「ぽこチャレ」',FAQ,'確認方法の参考。公式の9月当月ミッション本文は直接確認できていません。']]},'2026-10':{title:'2026年10月',start:'10/7(水)15:00',end:'10/13(火)23:59',open:missions(['衣替え','スポーツ','ハロウィン']),family:missions(['神無月','寒露','鉄道'],true),evidence:['衣替え：末尾の「え」まで入力。スポーツ：「の日」は付けない。ハロウィン：「ィ」は小文字。','神無月：末尾の「月」まで入力。寒露：漢字2文字。鉄道：「の日」は付けない。','ファミリー限定表示：［01］［05］［12］の必要数左側に「Ｆ」を付与。','［10］は「20人 いいねワンぽち」を採用。記事内画像の「20人回」は本文・問題文との表記差として扱います。'],sources:[['問題文・解答・Ｆ条件','姫桜愛華「ぽこチャレ／2026年10月情報」','https://note.com/himezakuraaika/n/nf9ea1209ef68','入力文字、必要数、Ｆ対象を照合。'],['解答・必要数','GTオレンジ・オープン部門','https://note.com/gt_orange/n/neaea6fcbd8a7','オープン部門を照合。'],['解答・必要数','GTオレンジ・ファミリー部門','https://note.com/gt_orange/n/n48b86af7bd77','ファミリー部門を照合。'],['同文補助','夜遊び紳士・オープン部門','https://note.com/gt_pink/n/n1f725e8738e9','既存記事とほぼ同文のため、独立した照合数には重複加算しない。'],['開催日時','HAISHIN Lab・オープン部門','https://haishin-lab.com/pocochaevent/1001224070/','開始・終了日時を確認。'],['開催日時','HAISHIN Lab・ファミリー部門','https://haishin-lab.com/pocochaevent/1001224080/','開始・終了日時を確認。'],['公式確認先','Pococha公式FAQ「ぽこチャレ」',FAQ,'確認方法の参考。公式の10月当月ミッション本文は直接確認できていません。']]}};
const keys=Object.keys(DATA).sort(),$=id=>document.getElementById(id);let current='2026-10';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function line(m,i){const n=String(i+1).padStart(2,'0');return `［${n}］${m.need} ${m.label}`;}
function copyText(kind){const d=DATA[current],name=kind==='open'?'🟠オープン部門':'🩷ファミリー部門',rows=d[kind].map(line).join('\n');return `【${d.title} ぽこチャレ】\n${name}\n\n開始：${d.start}\n終了：${d.end}\n\n${rows}`;}
function card(kind,d){const isOpen=kind==='open',title=isOpen?'🟠オープン':'🩷ファミリー',lis=d[kind].map((m,i)=>{const num=`［${String(i+1).padStart(2,'0')}］`,need=m.f?`<span class="f">Ｆ</span>${esc(m.need.replace(/^Ｆ/,''))}`:esc(m.need);return `<li class="mission"><span class="num">${num}</span><span class="need">${need}</span><span class="answer">${esc(m.label)}</span></li>`;}).join('');return `<article class="department ${kind}"><div class="department-head"><h2>${title}</h2><div class="period"><span>開始 <b>${esc(d.start)}</b></span><span>終了 <b>${esc(d.end)}</b></span></div></div><button class="copy-btn" type="button" data-copy="${kind}">${isOpen?'オープン':'ファミリー'}をコピー</button><ol class="missions">${lis}</ol></article>`;}
function renderSources(d){const checks=`<ul class="checks"><li>✅ 解答・必要数・Ｆ条件を項目別に照合</li><li>✅ 同文記事は独立情報元として重複加算しない</li><li>⚠️ 公式の当月ミッション本文は未確認。アプリ内表示を優先</li></ul>`,src=d.sources.map(s=>`<div class="source"><b>${esc(s[0])}</b><br><a href="${esc(s[2])}" target="_blank" rel="noopener noreferrer">${esc(s[1])}</a><small>${esc(s[3])}</small></div>`).join('');$('sourceBody').innerHTML=`${checks}<div class="source-list">${src}</div><p class="caution">リンク先の内容が更新・削除される可能性があります。</p>`;$('evidenceBody').innerHTML=`<ul class="checks">${d.evidence.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p>コピー文は表示上の折り返しに関係なく、各ミッションを1行で出力します。</p>`;}
function setMonth(key,push=true){current=key;$('month').value=key;document.querySelectorAll('details').forEach(x=>x.open=false);[...$('quick').children].forEach(b=>b.setAttribute('aria-current',b.dataset.month===key?'true':'false'));const d=DATA[key];if(!d){$('departments').innerHTML='<div class="empty">この年月は未収録です。</div>';$('status').textContent='収録済みの年月を選択してください。';$('sourceBody').innerHTML='';$('evidenceBody').innerHTML='';return;}$('departments').innerHTML=card('open',d)+card('family',d);$('status').innerHTML=`<strong>${esc(d.title)}</strong>／スマホでも常時2列表示・部門別コピー`;renderSources(d);$('prev').disabled=keys.indexOf(key)<=0;$('next').disabled=keys.indexOf(key)>=keys.length-1;if(push){const u=new URL(location.href);u.searchParams.set('month',key);history.replaceState(null,'',u);}}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1900);}
async function copy(kind){const text=copyText(kind);try{if(!navigator.clipboard)throw new Error('fallback');await navigator.clipboard.writeText(text);toast(kind==='open'?'オープン部門をコピーしました':'ファミリー部門をコピーしました');}catch(e){let box=document.querySelector('.manual-copy');if(!box){box=document.createElement('textarea');box.className='manual-copy';box.readOnly=true;$('evidenceBody').appendChild(box);}box.value=text;$('answerEvidence').open=true;box.focus();box.select();toast('文章を選択しました。コピーしてください');}}
$('departments').addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b)copy(b.dataset.copy);});$('refreshPage').addEventListener('click',()=>{toast('更新しています');setTimeout(()=>location.reload(),80);});$('month').addEventListener('change',e=>setMonth(e.target.value));$('prev').addEventListener('click',()=>{const i=keys.indexOf(current);if(i>0)setMonth(keys[i-1]);});$('next').addEventListener('click',()=>{const i=keys.indexOf(current);if(i<keys.length-1)setMonth(keys[i+1]);});$('quick').innerHTML=keys.map(k=>`<button type="button" class="quick" data-month="${k}">${DATA[k].title}</button>`).join('');$('quick').addEventListener('click',e=>{const b=e.target.closest('[data-month]');if(b)setMonth(b.dataset.month);});const initial=new URL(location.href).searchParams.get('month');setMonth(DATA[initial]?initial:'2026-10',false);
</script>
</body>
</html>
