'2026-05':{title:'2026年5月',note:'オープン13問を載せた資料は1件あり、別のPococha公開ページで一部のお題も確認できました。ただし全13問の複数照合に達していないため非表示です。',sources:[['全問候補・オープン','GTオレンジ「5月ポコチャレ解答」','https://note.com/gt_orange/n/n87cbeba75728','メーデー・憲法記念日・みどりの日を含む13問。'],['部分照合・Pococha公開タグ','Pococha 公開ライブタグ','https://www.pococha.com/en-us/app/users/b377ed81-03a4-4524-b2bf-6b4a931687f8/live-tags','「ぽこチャレ🆘憲法記念日」の公開タグを確認。MISSION5の答えを部分照合。全問照合ではありません。'],['部分照合・SNS公開ミラー','TwStalker しなぴー公開投稿','https://ww.twstalker.com/shinapy','2026年の公開投稿に「ぽこチャレ🆘憲法記念日コメ」を確認。MISSION5のみの補助資料。Pococha公開タグとSNS公開ミラーの2経路で部分一致を確認。'],['公式確認先','Pococha公式FAQ「ぽこチャレ」',FAQ,'過去5月の解答一覧ではありません。']]},
'2026-06':{title:'2026年6月',note:'通常月ではなく「甲子園ぽこチャレ」。13問の一覧は確認できましたが、全問解答の2ページが同一著者・同内容で、独立照合にならないため確定表示しません。開催期間は公式＋別サイトで照合済みです。',sources:[['全問候補','GTオレンジ「甲子園ぽこチャレ 6月」','https://note.com/gt_orange/n/n08500c3bb941','13問を掲載。'],['同一著者の重複資料','GTオレンジ 別ページ','https://note.com/gt_orange/n/nddc6a992e59e','同一著者・同内容のため独立照合には数えません。'],['公式日程・イベント存在','Pococha公式「Pococha甲子園2026」','https://report.pococha.com/n/n419c96421292','甲子園ぽこチャレの開催期間を確認。'],['日程照合','HAISHIN Lab「Pococha甲子園2026」','https://haishin-lab.com/news/2281/','6/11〜6/24の開催期間を照合。'],['日程照合・別運営','Blue Puddle「Pococha甲子園とは」','https://note.com/bluepuddle_liver/n/n69795c50b502','公式FAQを参照し、甲子園ぽこチャレ6/11〜6/24を別サイトでも確認。']]},
'2026-07':{title:'2026年7月',note:'通常ぽこチャレ／withファミリーのイベント存在は確認できましたが、全13問の解答資料を複数確認できていません。',sources:[['イベント存在','HAISHIN Lab サイトマップ',HAISHIN_MAP,'「ぽこチャレ7月」「with ファミリー7月」の掲載を確認。'],['追加検索結果','note・Ameblo・一般ブログ・X公開投稿を横断','https://search.yahoo.co.jp/realtime','「ぽこチャレ7月／withファミリー7月／解答／答え」で追加検索しましたが、2026年7月の全13問一覧は確認できませんでした。'],['公式確認先','Pococha公式FAQ「ぽこチャレ」',FAQ,'過去7月の解答一覧ではありません。']]}
};

const keys=Array.from({length:10},(_,i)=>'2026-'+String(i+1).padStart(2,'0'));
const $=id=>document.getElementById(id);let current='2026-10';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function line(m,i){const n=String(i+1).padStart(2,'0');return `［${n}］${m.need} ${m.label}`;}
function copyText(kind){const d=DATA[current];if(!d||!d.verified?.[kind]||!Array.isArray(d[kind]))return null;const name=kind==='open'?'🟠オープン部門':'🩷ファミリー部門',rows=d[kind].map(line).join('\n');return `【${d.title} ぽこチャレ】\n${name}\n\n開始：${d.start}\n終了：${d.end}\n\n${rows}`;}
function lockedCard(kind,d,reason){const isOpen=kind==='open',title=isOpen?'🟠オープン':'🩷ファミリー',start=d?.start||'未確認',end=d?.end||'未確認';return `<article class="department ${kind} locked"><div class="department-head"><h2>${title}</h2><div class="period"><span>開始 <b>${esc(start)}</b></span><span>終了 <b>${esc(end)}</b></span></div><span class="verify-chip">複数照合 未完了</span></div><button class="copy-btn" type="button" disabled>照合完了後にコピー</button><div class="locked-note">${esc(reason||'全13問を複数の公開情報で照合できていないため、解答を表示していません。')}</div></article>`;}
function card(kind,d){if(!d.verified?.[kind]||!Array.isArray(d[kind]))return lockedCard(kind,d,d.lockReason?.[kind]);const isOpen=kind==='open',title=isOpen?'🟠オープン':'🩷ファミリー',lis=d[kind].map((m,i)=>{const num=`［${String(i+1).padStart(2,'0')}］`,need=m.f?`<span class="f">Ｆ</span>${esc(m.need.replace(/^Ｆ/,''))}`:esc(m.need);return `<li class="mission"><span class="num">${num}</span><span class="need">${need}</span><span class="answer">${esc(m.label)}</span></li>`;}).join('');return `<article class="department ${kind}"><div class="department-head"><h2>${title}</h2><div class="period"><span>開始 <b>${esc(d.start)}</b></span><span>終了 <b>${esc(d.end)}</b></span></div></div><button class="copy-btn" type="button" data-copy="${kind}">${isOpen?'オープン':'ファミリー'}をコピー</button><ol class="missions">${lis}</ol></article>`;}
function sourceHTML(sources){return (sources||[]).map(s=>`<div class="source"><b>${esc(s[0])}</b><br><a href="${esc(s[2])}" target="_blank" rel="noopener noreferrer">${esc(s[1])}</a><small>${esc(s[3])}</small></div>`).join('');}
function renderSources(d,research=null){const verifiedCount=d?Object.values(d.verified||{}).filter(Boolean).length:0;const checks=`<ul class="checks"><li>✅ 解答を表示する部門は複数の公開情報で照合</li><li>🔎 検索範囲：Pococha公式／HAISHIN Lab／note／Ameblo／一般ブログ／Pococha公開タグ／Yahoo!リアルタイム検索（X公開投稿）／SNS公開ミラー</li><li>✅ 同一著者の重複・ほぼ同文の記事は独立情報元として過大評価しない</li><li>🧩 一部ミッションだけ一致する資料は「部分照合」として記録し、全13問の確定根拠にはしない</li><li>🔁 同一人物・同一記事の転載、検索スニペットの重複は別ソースとして数えない</li><li>🛑 全13問を照合できない部門は解答・コピーを停止</li><li>⚠️ 最終確認はPocochaアプリ内の当該イベント画面を優先</li></ul>`;const src=sourceHTML(d?.sources||research?.sources);$('sourceBody').innerHTML=`${checks}<p><b>照合状況：</b>${d?verifiedCount+'/2部門を表示可能':'解答表示なし・調査記録のみ'}</p><div class="source-list">${src}</div><p class="caution">「候補」と記載した資料だけでは確定扱いにしません。リンク先は更新・削除される可能性があります。</p>`;if(d)$('evidenceBody').innerHTML=`<ul class="checks">${d.evidence.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p>コピー文は表示上の折り返しに関係なく、各ミッションを1行で出力します。</p>`;else $('evidenceBody').innerHTML=`<ul class="checks"><li>${esc(research.note)}</li><li>推測で解答を補完しません。追加の独立資料が確認できた時点で収録対象にします。</li></ul>`;}
function researchView(r){return `<article class="department open locked"><div class="department-head"><h2>🟠オープン</h2><span class="verify-chip">照合中</span></div><button class="copy-btn" disabled>解答未収録</button><div class="locked-note">${esc(r.note)}</div></article><article class="department family locked"><div class="department-head"><h2>🩷ファミリー</h2><span class="verify-chip">照合中</span></div><button class="copy-btn" disabled>解答未収録</button><div class="locked-note">複数の全問資料を確認できるまで表示しません。</div></article>`;}
function setMonth(key,push=true){if(!keys.includes(key))key='2026-10';current=key;$('month').value=key;document.querySelectorAll('details').forEach(x=>x.open=false);[...$('quick').children].forEach(b=>b.setAttribute('aria-current',b.dataset.month===key?'true':'false'));const d=DATA[key],r=RESEARCH[key];if(d){$('departments').innerHTML=card('open',d)+card('family',d);const ok=Object.values(d.verified).filter(Boolean).length;$('status').innerHTML=`<strong>${esc(d.title)}</strong>／複数照合済み ${ok}/2部門`;renderSources(d);}else if(r){$('departments').innerHTML=researchView(r);$('status').innerHTML=`<strong>${esc(r.title)}</strong>／照合未完了・誤情報防止のため解答非表示`;renderSources(null,r);}else{$('departments').innerHTML='<div class="empty">この年月は未調査です。</div>';$('status').textContent='確認できる資料を調査中です。';$('sourceBody').innerHTML='';$('evidenceBody').innerHTML='';}$('prev').disabled=keys.indexOf(key)<=0;$('next').disabled=keys.indexOf(key)>=keys.length-1;if(push){const u=new URL(location.href);u.searchParams.set('month',key);history.replaceState(null,'',u);}}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1900);}
async function copy(kind){const text=copyText(kind);if(!text){toast('この部門は複数照合が未完了です');return;}try{if(!navigator.clipboard)throw new Error('fallback');await navigator.clipboard.writeText(text);toast(kind==='open'?'オープン部門をコピーしました':'ファミリー部門をコピーしました');}catch(e){let box=document.querySelector('.manual-copy');if(!box){box=document.createElement('textarea');box.className='manual-copy';box.readOnly=true;$('evidenceBody').appendChild(box);}box.value=text;$('answerEvidence').open=true;box.focus();box.select();toast('文章を選択しました。コピーしてください');}}
$('departments').addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b)copy(b.dataset.copy);});$('refreshPage').addEventListener('click',()=>{toast('更新しています');setTimeout(()=>location.reload(),80);});$('month').addEventListener('change',e=>setMonth(e.target.value));$('prev').addEventListener('click',()=>{const i=keys.indexOf(current);if(i>0)setMonth(keys[i-1]);});$('next').addEventListener('click',()=>{const i=keys.indexOf(current);if(i<keys.length-1)setMonth(keys[i+1]);});$('quick').innerHTML=keys.map(k=>{const d=DATA[k],r=RESEARCH[k],label=d?.title||r?.title||k;const ok=d?Object.values(d.verified).filter(Boolean).length:0;const mark=ok===2?'✓':ok===1?'◐':'…';return `<button type="button" class="quick" data-month="${k}">${label.replace('2026年','')}${mark}</button>`;}).join('');$('quick').addEventListener('click',e=>{const b=e.target.closest('[data-month]');if(b)setMonth(b.dataset.month);});const initial=new URL(location.href).searchParams.get('month');setMonth(keys.includes(initial)?initial:'2026-10',false);
</script>
